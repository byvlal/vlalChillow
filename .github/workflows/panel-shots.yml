name: panel shots

# Снимки страницы панели. В песочнице агента браузера нет (нет libnss и apt
# закрыт), а в раннере Chromium ставится одной командой — поэтому визуальная
# проверка живёт здесь: страница открывается по-настоящему, PNG коммитятся
# в preview/shots, и верстку видно глазами, а не по CSS.
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'server/Web/wwwroot/**'
      - 'preview/**'

permissions:
  contents: write

concurrency:
  group: panel-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install playwright
        run: |
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Start the stand-in server
        run: |
          node preview/preview-server.js &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Take shots
        run: node preview/shots.mjs http://127.0.0.1:8080 preview/shots

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-shots
          path: preview/shots
          if-no-files-found: warn

      - name: Commit shots
        if: success()
        run: |
          git config user.name "panel shots"
          git config user.email "shots@users.noreply.github.com"
          git add preview/shots
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(preview): refresh panel shots [skip ci]"
          git push
