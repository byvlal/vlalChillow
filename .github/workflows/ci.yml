name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── снимки страницы ───────────────────────────────────────────────────────
  # В песочнице агента браузера нет (нет libnss, apt закрыт), поэтому «как это
  # выглядит» проверяется здесь: страница открывается в настоящем Chromium,
  # PNG кладутся в артефакт, а сломанные шрифты/ассеты валят job.
  shots:
    name: panel shots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install playwright
        run: |
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Start the stand-in server
        run: |
          node preview/preview-server.js &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 0.5
          done
          echo "server did not start" >&2
          exit 1

      # Ошибка снимается аннотацией (::error::) — лог прогона из закрытой сети
      # не скачать, а аннотации отдаёт api.github.com.
      - name: Take shots
        shell: bash
        run: |
          if node preview/shots.mjs http://127.0.0.1:8080 preview/shots 2>&1 | tee shots.log; then
            exit 0
          fi
          tail -40 shots.log | while IFS= read -r line; do echo "::error::${line}"; done
          exit 1

      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-shots
          path: preview/shots
          if-no-files-found: warn

      # Скачать артефакт можно не всегда (хранилище артефактов бывает закрыто),
      # поэтому снимки ещё и коммитятся обратно — тогда страницу видно прямо
      # в ветке. [skip ci] не даёт снимкам запускать новый прогон.
      - name: Commit shots back
        if: success() && github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "panel shots"
          git config user.email "shots@users.noreply.github.com"
          git add preview/shots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(preview): panel shots [skip ci]"
          # set -o pipefail: без него tee съедает код возврата git push и шаг
          # «падает» уже после успешной отправки.
          if set -o pipefail && git push origin "HEAD:${{ github.event.pull_request.head.ref }}" 2>&1 | tee push.log; then
            exit 0
          fi
          # Токену могло не хватить прав на запись: это не поломка страницы,
          # поэтому шаг не валит job, но говорит об этом прямо.
          tail -5 push.log | while IFS= read -r line; do echo "::warning::${line}"; done
          echo "::warning::снимки готовы, но не закоммичены: у токена нет прав на запись"

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore server/StandChillow.LanServer.csproj

      # Ошибки компиляции выводятся ещё и аннотациями (::error::): по ним CI-прогон
      # можно разобрать из API, не выкачивая лог целиком, — а лог часто недоступен
      # из закрытых сетей, где работает агент. Строки те же, что в обычном выводе.
      - name: Build server
        shell: bash
        run: |
          set -o pipefail
          dotnet build server/StandChillow.LanServer.csproj -c Release --no-restore 2>&1 \
            | tee "${{ runner.temp }}/build-server.log"

      - name: Annotate build errors
        if: failure()
        shell: bash
        run: |
          for log in "${{ runner.temp }}/build-server.log"; do
            [ -f "$log" ] || continue
            grep -E 'error (CS|MSB|NETSDK)[0-9]+' "$log" | sort -u | head -60 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          done

      - name: Build Telegram plugin
        run: dotnet build server/plugins-src/StandChillow.Plugin.Telegram/StandChillow.Plugin.Telegram.csproj -c Release

      - name: Test protocol invariants
        shell: bash
        run: >-
          set -o pipefail; dotnet test tests/StandChillow.LanServer.Tests/StandChillow.LanServer.Tests.csproj
          -c Release --results-directory "${{ runner.temp }}/test-results"
          --logger "trx;LogFileName=protocol-tests.trx"
          2>&1 | tee "${{ runner.temp }}/test-output.txt"

      - name: Annotate failed protocol assertions
        if: failure()
        shell: bash
        run: |
          grep -A 12 -E 'Error Message:|Failed StandChillow' "${{ runner.temp }}/test-output.txt" \
            | head -60 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload failed test report (${{ matrix.rid }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-protocol-tests-${{ matrix.rid }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: error
          retention-days: 3

      - name: Publish self-contained server (${{ matrix.rid }})
        run: >-
          dotnet publish server/StandChillow.LanServer.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          -o ${{ runner.temp }}/standchillow-publish

      # PR runs upload too (shorter retention): lets a branch build be tested on a
      # real desktop/handset before merge without pushing to main.
      - name: Upload runnable server (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: standchillow-server-${{ matrix.rid }}
          path: ${{ runner.temp }}/standchillow-publish
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}

  release:
    name: GitHub Release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes needs a git repo to find the previous tag
      # ("fatal: not a git repository (or any of the parent directories): .git"),
      # so check out the tagged commit before touching the release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One subdirectory per artifact (all three builds share the same file names,
      # so they must NOT be merged into one directory).
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Package and publish release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in release/standchillow-server-*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -q -r "../../out/${name}.zip" .)
          done
          ls -l out
          tag="$GITHUB_REF_NAME"
          # A release created by hand in the UI (pre-release flow) already owns the tag;
          # upload into it instead of failing with 422 already_exists.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists — uploading assets"
            gh release upload "$tag" out/*.zip --clobber
          else
            # Tags starting with 'v' published from CI are pre-releases until promoted.
            gh release create "$tag" out/*.zip \
              --title "влалChillow Server $tag" \
              --prerelease \
              --generate-notes
          fi

  format:
    name: format (advisory)
    runs-on: ubuntu-latest
    # Advisory until the tree is fully formatted. Set continue-on-error to false
    # once `dotnet format` reports a clean run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check formatting
        run: dotnet format server/StandChillow.LanServer.csproj --verify-no-changes --severity warn

  panel:
    name: panel page (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Страница панели — единственный JS в проекте, и до сих пор её проверяли
      # только руками. jsdom не в dependencies: ставим отдельно, как написано в
      # шапке tests/panel/panel.test.js.
      - name: Install jsdom
        run: npm install --prefix "$RUNNER_TEMP/panel" jsdom --no-audit --no-fund

      - name: Check panel page
        run: NODE_PATH="$RUNNER_TEMP/panel/node_modules" node tests/panel/panel.test.js

  hygiene:
    name: hygiene guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reverse-engineering dumps, game binaries and runtime captures must never
      # enter the published tree.
      - name: Reject RE dumps and game binaries
        run: |
          bad=$(git ls-files | grep -E '^(decompiled|original)/|\.(apk|aab|so|unity3d|dat)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must stay local (see .gitignore):"
            echo "$bad"
            exit 1
          fi

      # The gold capture set (captures/captures.zip, session 20261112_0351..0404) IS
      # committed on purpose: it is the evidence the whole match decoder is built
      # from (see ARCHITECTURE.md). captures/chat.zip is the probe client at the
      # phone host (sessions 20261114_0444..0445, 4326 frames) — the evidence for the
      # ChatManager author byte and field=1/2 that README and MatchChatWireTests cite.
      # captures/grenades.zip is the session 20261115_0821..0824 (11218 frames, one
      # phone, GrenadeManager CreateWorldObject + 145 CustomEvent) uploaded as the
      # grenade evidence set; it is allow-listed here so the guard keeps failing on
      # every *other* stray dump instead of on this one.
      # captures/duel.zip is the Duel session (one phone vs dedicated host) — the
      # evidence for the Duel C2=101 round-end bag, the GameRpcHelper field=1
      # signal and the C2=22 freeze bag (issue #56). Allow-listed for the same
      # reason as grenades.zip.
      # Everything else under captures/ and any run log still stays out — see
      # .gitignore; a new probe drop needs its own entry here on purpose, so an
      # accidental large dump still fails the build.
      - name: Reject committed logs and stray captures
        shell: bash
        run: |
          found=0

          logs=$(git ls-files | grep -E '(^|/)logs/|\.log$' || true)
          if [ -n "$logs" ]; then
            echo "::error::Run logs are evidence-only, do not commit:"
            echo "$logs"
            found=1
          fi

          stray=$(git ls-files 'captures/*' | grep -vE '^captures/(README\.md|captures\.zip|chat\.zip|grenades\.zip|duel\.zip)$' || true)
          if [ -n "$stray" ]; then
            echo "::error::Only the capture sets listed above may be committed (see ARCHITECTURE.md):"
            echo "$stray"
            found=1
          fi

          exit "$found"
